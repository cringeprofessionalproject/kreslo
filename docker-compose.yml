services:
  kreslo-game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heuristics-kreslo
    restart: unless-stopped
    ports:
      - "127.0.0.1:4180:8080"
    volumes:
      - kreslo_zero_pii_stats:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  kreslo_zero_pii_stats:
