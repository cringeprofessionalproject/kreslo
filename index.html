<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1512" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="КРЕСЛО" />
    <meta
      name="description"
      content="КРЕСЛО (@vkreslegame): карточный симулятор острых рабочих решений, блиц-дуэли с друзьями и реальные исторические кейсы."
    />
    <meta property="og:title" content="КРЕСЛО · Симулятор рабочих решений" />
    <meta
      property="og:description"
      content="Офис на грани, бизнес, переговоры и реальные факапы истории. На какой смене срежешься ты?"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./icon-512.png" />
    <link rel="stylesheet" href="./assets/fonts/fonts.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <title>КРЕСЛО · Симулятор рабочих решений</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0d1512;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Страховка от «белого/чёрного экрана»: если за 6 с игра не отрисовалась — показываем ошибку и кнопку сброса
      (function () {
        var errs = [];
        window.addEventListener('error', function (e) {
          errs.push(String(e.message || e.error || 'error'));
        });
        window.addEventListener('unhandledrejection', function (e) {
          errs.push(String((e.reason && (e.reason.message || e.reason)) || 'rejection'));
        });
        setTimeout(function () {
          var r = document.getElementById('root');
          if (r && r.childElementCount === 0) {
            r.innerHTML =
              '<div style="font-family:-apple-system,system-ui,sans-serif;color:#f4efe4;padding:32px 24px;max-width:420px;margin:0 auto">' +
              '<div style="font-size:20px;font-weight:800;margin-bottom:10px">КРЕСЛО не запустилось</div>' +
              '<div style="opacity:.7;font-size:14px;line-height:1.45;margin-bottom:16px">' +
              (errs.length ? 'Ошибка: ' + errs[0].slice(0, 160) : 'Игра не загрузилась (медленная сеть или старый кэш).') +
              '</div><button id="kreslo-reset" style="padding:12px 18px;border-radius:12px;border:0;background:#f4efe4;color:#0d1512;font-weight:800;font-size:15px">Сбросить кэш и перезапустить</button></div>';
            document.getElementById('kreslo-reset').onclick = function () {
              var done = function () { location.reload(); };
              Promise.all([
                (navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (x) { return x.unregister(); })); }) : Promise.resolve()),
                (window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : Promise.resolve())
              ]).then(done, done);
            };
          }
        }, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
